[package]
name = "rest-harness"
version = "0.1.0"
edition = "2021"
description = "Interactive desktop REST API client core: pure-Rust domain model and git-friendly YAML filesystem persistence."
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "rest-harness"
path = "src/main.rs"

[lib]
name = "rest_harness"
path = "src/lib.rs"
